  <g font-family="'Cascadia Code','Fira Code',monospace" font-size="14" fill="#e6edf3">
    <text x="20" y="76"><tspan fill="#ff7b72">async </tspan><tspan fill="#ffa657">function</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">delegatedTask</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#79c0ff">maxAttempts</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#79c0ff">3</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#79c0ff">maxSteps</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#79c0ff">40</tspan><tspan fill="#e6edf3">) {</tspan></text>
    <text x="42" y="106"><tspan fill="#ff7b72">for </tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#ff7b72">let</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">i</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#79c0ff">1</tspan><tspan fill="#e6edf3">; </tspan><tspan fill="#79c0ff">i</tspan><tspan fill="#e6edf3"> &lt;= </tspan><tspan fill="#79c0ff">maxAttempts</tspan><tspan fill="#e6edf3">; </tspan><tspan fill="#79c0ff">i</tspan><tspan fill="#e6edf3">++) {</tspan></text>
    <text x="64" y="136"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">r</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">agent</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#ffa657">goal</tspan><tspan fill="#e6edf3">, { </tspan><tspan fill="#ffa657">budget</tspan><tspan fill="#e6edf3">: { </tspan><tspan fill="#ffa657">maxSteps</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">N</tspan><tspan fill="#e6edf3"> } })</tspan></text>
    <text x="64" y="171"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#79c0ff">r</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">error</tspan><tspan fill="#e6edf3">) {</tspan></text>
    <text x="86" y="201"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">reason</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#ffa657">goal</tspan><tspan fill="#e6edf3">, { </tspan><tspan fill="#ffa657">observation</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">r</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">error</tspan><tspan fill="#e6edf3"> })</tspan></text>
    <text x="86" y="236"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">action</tspan><tspan fill="#e6edf3"> === </tspan><tspan fill="#a5d6ff">'retry'</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#ff7b72">continue</tspan></text>
    <text x="86" y="266"><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3"> { </tspan><tspan fill="#ffa657">status</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#a5d6ff">'escalate'</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#ffa657">reason</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">reason</tspan><tspan fill="#e6edf3"> }</tspan></text>
    <text x="64" y="296"><tspan fill="#e6edf3">}</tspan></text>
    <text x="42" y="326"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">traj</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">extractTrajectory</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#79c0ff">r</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="42" y="356"><tspan fill="#ff7b72">const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#ff7b72">await</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">reason</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#ffa657">goal</tspan><tspan fill="#e6edf3">, { </tspan><tspan fill="#ffa657">observation</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">r</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">data</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">text</tspan><tspan fill="#e6edf3">,</tspan></text>
    <text x="64" y="386"><tspan fill="#ffa657">trajectory</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">traj</tspan><tspan fill="#e6edf3"> })</tspan></text>
    <text x="42" y="421"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">action</tspan><tspan fill="#e6edf3"> === </tspan><tspan fill="#a5d6ff">'done'</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#ff7b72">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">data</tspan></text>
    <text x="42" y="451"><tspan fill="#ff7b72">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#79c0ff">v</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#ffa657">action</tspan><tspan fill="#e6edf3"> === </tspan><tspan fill="#a5d6ff">'continue'</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#ff7b72">continue</tspan></text>
